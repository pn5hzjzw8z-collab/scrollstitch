<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ScrollStitch v6</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111}
main{max-width:720px;margin:auto;padding:18px 14px 40px}
h1{margin:4px 0 5px;font-size:28px}
.sub{color:#666;margin:0 0 14px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;font-size:17px;font-weight:600;background:#111;color:#fff}
.secondary{background:#e8e8ed;color:#111}
#pick{display:none}
#list{margin-top:10px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eee}
.item img{width:58px;height:58px;object-fit:cover;border-radius:8px}
.item span{font-size:13px;flex:1;word-break:break-all}
#status{color:#555;white-space:pre-wrap;line-height:1.5}
#result{width:100%;border-radius:10px;margin-top:12px;display:none}
small{color:#777}
.ok{color:#087a00}
.warn{color:#9a6500}
.err{color:#b00020}
</style>
</head>
<body>
<main>
<h1>📜 ScrollStitch v6</h1>
<div class="sub">スクロール撮影 → 複数選択 → 重複部分を自動検出 → 結合</div>

<div class="card">
<button class="btn" id="pickBtn" type="button">🖼️ 写真を選択</button>
<input id="pick" type="file" accept="image/*" multiple>
<button class="btn secondary" id="clear" type="button">選択をクリア</button>
<div id="status">写真を2枚以上選択してください。</div>
<div id="list"></div>
</div>

<div class="card">
<button class="btn" id="go" type="button">🔗 重複部分を自動検出して結合</button>
<div id="diag"></div>
<img id="result" alt="結合結果">
<button class="btn secondary" id="save" type="button" style="display:none">💾 結合画像を保存</button>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const status=t=>{$('status').textContent=t};
let files=[];

$('pickBtn').onclick=()=>$('pick').click();
$('pick').onchange=()=>{
  files=[...$('pick').files];
  renderList();
};
$('clear').onclick=()=>{
  files=[];$('pick').value='';$('list').innerHTML='';$('diag').innerHTML='';
  $('result').style.display='none';$('save').style.display='none';
  status('写真を2枚以上選択してください。');
};

function renderList(){
  $('list').innerHTML='';
  files.forEach((f,i)=>{
    const d=document.createElement('div');d.className='item';
    const im=document.createElement('img');im.src=URL.createObjectURL(f);
    const s=document.createElement('span');s.textContent=(i+1)+'. '+f.name;
    d.append(im,s);$('list').append(d);
  });
  status(files.length>=2?files.length+'枚選択中。順番は選択された順です。':'写真を2枚以上選択してください。');
}
function loadImage(file){
  return new Promise((resolve,reject)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};
    im.onerror=reject;im.src=u;
  });
}

/*
  ScrollStitch.exe の README の「仕組みの概要」をブラウザ用に移植した実装。
  ・画素そのものではなく勾配（エッジ）を使う
  ・各行を特徴ベクトル化し、正規化相互相関(NCC)で行同士を比較
  ・勾配エネルギーで平坦な行の影響を小さくする
  ・各スクロール量候補について、一致する連続帯を最大部分和で探す
  ・固定UIのような「両フレームで変化しない帯」は重みを下げる
*/

const SAMPLE_W=320;
const ROW_BINS=64;

function grayAt(data,p){
  return 0.299*data[p]+0.587*data[p+1]+0.114*data[p+2];
}

function makeFeatures(im){
  const W=SAMPLE_W;
  const H=Math.max(1,Math.round(im.naturalHeight*W/im.naturalWidth));
  const c=document.createElement('canvas'); c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(im,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data;

  // 各行を64区間の勾配特徴へ圧縮。色変化より輪郭・文字の配置を重視する。
  const feat=new Float32Array(H*ROW_BINS);
  const energy=new Float32Array(H);
  const scalar=new Float32Array(H);

  for(let y=0;y<H;y++){
    let e=0;
    for(let b=0;b<ROW_BINS;b++){
      const x0=Math.floor(b*W/ROW_BINS);
      const x1=Math.max(x0+1,Math.floor((b+1)*W/ROW_BINS));
      let sum=0,count=0;
      for(let xx=x0;xx<x1;xx++){
        const xr=Math.min(W-1,xx+1);
        const p=(y*W+xx)*4, q=(y*W+xr)*4;
        let g=Math.abs(grayAt(d,p)-grayAt(d,q));
        if(y>0){
          const r=(y*W+xx)*4, u=((y-1)*W+xx)*4;
          g+=0.65*Math.abs(grayAt(d,r)-grayAt(d,u));
        }
        sum+=g;count++;
      }
      const v=sum/count;
      feat[y*ROW_BINS+b]=v;
      e+=v;
    }
    energy[y]=e/ROW_BINS;
    scalar[y]=e;
  }

  // 横方向に軽く平滑化
  for(let y=1;y<H-1;y++){
    let e=0;
    for(let b=0;b<ROW_BINS;b++){
      const i=y*ROW_BINS+b;
      feat[i]=(feat[i-ROW_BINS]+2*feat[i]+feat[i+ROW_BINS])/4;
      e+=feat[i];
    }
    energy[y]=e/ROW_BINS;
  }

  return {W,H,feat,energy,scalar};
}

function rowNCC(A,ay,B,by){
  const oa=ay*ROW_BINS, ob=by*ROW_BINS;
  let ma=0,mb=0;
  for(let k=0;k<ROW_BINS;k++){ma+=A.feat[oa+k];mb+=B.feat[ob+k]}
  ma/=ROW_BINS;mb/=ROW_BINS;
  let num=0,da=0,db=0;
  for(let k=0;k<ROW_BINS;k++){
    const a=A.feat[oa+k]-ma,b=B.feat[ob+k]-mb;
    num+=a*b;da+=a*a;db+=b*b;
  }
  const den=Math.sqrt(da*db)+1e-6;
  return num/den;
}

// 「両方で変化しない行」を固定UI候補として弱める。
function buildFixedMask(A,B){
  const n=Math.min(A.H,B.H);
  const m=new Float32Array(n);
  for(let y=0;y<n;y++){
    const e=Math.min(A.energy[y],B.energy[y]);
    const sim=rowNCC(A,y,B,y);
    m[y]=(sim>0.92 && e<18)?0.20:1.0;
  }
  return m;
}

/*
  2枚 A,B の重複を検出。
  off = Bの0行目に対応するA側の行番号。
  overlap = min(H)-off。
  各候補offで row score を作り、連続一致帯の最大部分和を探す。
*/
function detectOverlap(A,B){
  const maxH=Math.min(A.H,B.H);
  const minOverlap=Math.max(80,Math.floor(maxH*0.08));
  const maxOverlap=Math.floor(maxH*0.88);
  const fixed=buildFixedMask(A,B);
  let best=null;

  // Candidate overlap.  For each candidate, compare A's bottom with B's top.
  // The reference implementation uses row-NCC; here we additionally reward
  // a long continuous run of good row matches and penalize isolated matches.
  for(let overlap=minOverlap;overlap<=maxOverlap;overlap+=2){
    const off=A.H-overlap;
    const n=Math.min(overlap,B.H);
    let total=0, good=0, run=0, bestRun=0;
    let weighted=0, weightSum=0;

    for(let j=0;j<n;j++){
      const ay=off+j, by=j;
      const ncc=rowNCC(A,ay,B,by);
      const e=Math.min(A.energy[ay],B.energy[by]);
      const energyW=Math.min(1,Math.sqrt(e/18));
      const fixedW=fixed[Math.min(j,fixed.length-1)];
      const w=0.35+0.65*energyW;
      const s=ncc*w*fixedW;
      weighted+=s; weightSum+=w*fixedW;
      total+=ncc;
      if(ncc>=0.55){good++;run++;bestRun=Math.max(bestRun,run)}
      else if(ncc>=0.40){run=Math.max(0,run-1)}
      else {run=0}
    }

    const avg=weighted/Math.max(1,weightSum);
    const coverage=good/Math.max(1,n);
    const runCoverage=bestRun/Math.max(1,n);
    // Strong preference for candidates with a long, contiguous matching area.
    const score=0.45*avg + 0.30*coverage + 0.25*runCoverage;
    if(!best || score>best.score){
      best={overlap,off,score,avg,coverage,runCoverage,bestRun};
    }
  }

  // Fine search around the best candidate, one pixel at a time.
  const center=best.overlap;
  let fine=best;
  for(let overlap=Math.max(minOverlap,center-16);overlap<=Math.min(maxOverlap,center+16);overlap++){
    const off=A.H-overlap;
    const n=Math.min(overlap,B.H);
    let sum=0, weightSum=0, good=0, run=0, bestRun=0;
    for(let j=0;j<n;j++){
      const ncc=rowNCC(A,off+j,B,j);
      const e=Math.min(A.energy[off+j],B.energy[j]);
      const w=0.35+0.65*Math.min(1,Math.sqrt(e/18));
      const fw=fixed[Math.min(j,fixed.length-1)];
      sum+=ncc*w*fw; weightSum+=w*fw;
      if(ncc>=0.55){good++;run++;bestRun=Math.max(bestRun,run)}
      else if(ncc>=0.40){run=Math.max(0,run-1)}
      else {run=0}
    }
    const avg=sum/Math.max(1,weightSum);
    const coverage=good/Math.max(1,n);
    const runCoverage=bestRun/Math.max(1,n);
    const score=0.45*avg+0.30*coverage+0.25*runCoverage;
    if(score>fine.score) fine={overlap,off,score,avg,coverage,runCoverage,bestRun};
  }

  const confidence=Math.max(0,Math.min(1,
    0.35*Math.max(0,(fine.avg-0.20)/0.65)+
    0.35*Math.min(1,fine.coverage/0.65)+
    0.30*Math.min(1,fine.runCoverage/0.45)
  ));
  fine.confidence=confidence;
  return fine;
}

async function stitch(){
  if(files.length<2){status('写真を2枚以上選択してください。');return}
  $('go').disabled=true;$('save').style.display='none';$('result').style.display='none';
  try{
    status('画像を読み込み中…');
    const ims=await Promise.all(files.map(loadImage));
    const W=ims[0].naturalWidth;
    const H=ims[0].naturalHeight;
    for(const im of ims){
      if(im.naturalWidth!==W||im.naturalHeight!==H){
        status('⚠️ 画像サイズが違います。すべて同じサイズのスクリーンショットを使ってください。');
        return;
      }
    }

    const feats=ims.map((im,i)=>{status(`画像解析中… ${i+1}/${ims.length}`);return makeFeatures(im)});

    const pairs=[];
    for(let i=1;i<ims.length;i++){
      status(`重複部分を検出中… ${i}/${ims.length-1}`);
      const r=detectOverlap(feats[i-1],feats[i]);
      pairs.push(r);
    }

    let totalH=H;
    for(const r of pairs) totalH += H-r.overlap;
    const MAX=30000;
    if(totalH>MAX){
      status(`⚠️ 出力が${totalH}pxになるため、30000pxを超えます。写真枚数を減らしてください。`);
      return;
    }

    const canvas=document.createElement('canvas');
    canvas.width=W;canvas.height=totalH;
    const ctx=canvas.getContext('2d');
    let y=0;
    ctx.drawImage(ims[0],0,y);y+=H;

    for(let i=1;i<ims.length;i++){
      const crop=pairs[i-1].overlap;
      ctx.drawImage(ims[i],0,crop,W,H-crop,0,y,W,H-crop);
      y+=H-crop;
    }

    $('result').src=canvas.toDataURL('image/png');
    $('result').style.display='block';
    $('save').style.display='block';

    let d='<div class="card"><b>🔎 検出結果</b><br>';
    pairs.forEach((r,i)=>{
      d+=`${i+1} → ${i+2}：重複 ${Math.round(r.overlap*H/feats[i].H)} px / 信頼度 ${Math.round(r.confidence*100)}%${r.confidence<0.45?' ⚠️':''}<br>`;
    });
    d+=`<small>※v5をベースに、勾配画像＋行NCC＋連続一致帯で重複を判定します。</small></div>`;
    $('diag').innerHTML=d;
    status('✅ 重複部分を検出して結合完了！');
  }catch(e){
    console.error(e);
    status('❌ エラー：'+(e.message||e));
  }finally{$('go').disabled=false}
}

$('go').onclick=stitch;
$('save').onclick=()=>{
  const a=document.createElement('a');
  a.href=$('result').src;
  a.download='ScrollStitch_'+new Date().toISOString().replace(/[-:T.Z]/g,'').slice(0,14)+'.png';
  a.click();
};
</script>
</body>
</html>
